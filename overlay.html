<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BonkData - Overlay</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
            color: #e8e8e8;
            padding: 10px;
            overflow-y: auto;
        }

        .overlay-container {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .overlay-header {
            background: rgba(0, 255, 136, 0.1);
            border: 2px solid #00ff88;
            border-radius: 8px;
            padding: 12px;
            text-align: center;
        }

        .overlay-header h2 {
            color: #00ff88;
            font-size: 1.1rem;
            margin-bottom: 5px;
        }

        .overlay-header p {
            color: #888;
            font-size: 0.8rem;
        }

        .no-build {
            background: rgba(255, 215, 0, 0.1);
            border: 2px solid #ffd700;
            border-radius: 8px;
            padding: 20px;
            text-align: center;
        }

        .no-build h3 {
            color: #ffd700;
            margin-bottom: 10px;
        }

        .no-build p {
            color: #e8e8e8;
            font-size: 0.9rem;
            line-height: 1.5;
        }

        .build-section {
            background: rgba(0, 0, 0, 0.4);
            border-radius: 8px;
            padding: 10px;
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        .build-section h3 {
            color: #00d9ff;
            font-size: 0.9rem;
            margin-bottom: 10px;
            display: flex;
            align-items: center;
            gap: 5px;
        }

        .items-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 8px;
        }

        .item-card {
            background: rgba(0, 0, 0, 0.5);
            border: 2px solid rgba(255, 255, 255, 0.2);
            border-radius: 6px;
            padding: 8px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 5px;
            transition: all 0.2s ease;
            position: relative;
        }

        .item-card:hover {
            border-color: #00d9ff;
            transform: scale(1.05);
        }

        .item-card.default {
            border-color: rgba(255, 215, 0, 0.5);
            background: rgba(255, 215, 0, 0.05);
        }

        .item-card img {
            width: 50px;
            height: 50px;
            object-fit: contain;
        }

        .item-name {
            font-size: 0.7rem;
            text-align: center;
            color: #e8e8e8;
            line-height: 1.2;
        }

        .item-number {
            position: absolute;
            top: -6px;
            right: -6px;
            background: linear-gradient(135deg, #00d9ff, #0088cc);
            color: #fff;
            width: 18px;
            height: 18px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 0.7rem;
            font-weight: bold;
            box-shadow: 0 2px 5px rgba(0, 0, 0, 0.5);
        }

        .item-number.default {
            background: linear-gradient(135deg, #ffd700, #ffed4e);
            color: #1a1a2e;
        }

        .character-display {
            display: flex;
            justify-content: center;
            padding: 10px;
        }

        .character-card {
            background: rgba(0, 0, 0, 0.5);
            border: 2px solid rgba(0, 217, 255, 0.5);
            border-radius: 8px;
            padding: 10px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 8px;
        }

        .character-card img {
            width: 80px;
            height: 80px;
            object-fit: contain;
        }

        .character-name {
            font-size: 0.9rem;
            color: #00d9ff;
            font-weight: bold;
        }

        /* Suggestion Panel Styles */
        .suggestion-panel {
            background: linear-gradient(135deg, #ff6b6b 0%, #ff8e53 100%);
            border: 3px solid #fff;
            border-radius: 12px;
            padding: 15px;
            margin-bottom: 15px;
            box-shadow: 0 8px 20px rgba(255, 107, 107, 0.5);
            animation: slideIn 0.3s ease-out;
        }

        @keyframes slideIn {
            from {
                transform: translateY(-20px);
                opacity: 0;
            }
            to {
                transform: translateY(0);
                opacity: 1;
            }
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
            }
            to {
                opacity: 1;
            }
        }

        .suggestion-header {
            text-align: center;
            margin-bottom: 12px;
        }

        .suggestion-header h3 {
            color: #fff;
            font-size: 1.4rem;
            margin-bottom: 5px;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.5);
        }

        .suggestion-header p {
            color: #ffe;
            font-size: 0.9rem;
        }

        .suggestion-list {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .suggestion-item {
            background: rgba(255, 255, 255, 0.95);
            border-radius: 8px;
            padding: 10px;
            display: flex;
            align-items: center;
            gap: 10px;
            position: relative;
            animation: fadeIn 0.4s ease-out;
            transition: transform 0.2s ease;
        }

        .suggestion-item:hover {
            transform: scale(1.05);
        }

        .suggestion-item.priority-high {
            border: 3px solid #00ff88;
            box-shadow: 0 0 15px rgba(0, 255, 136, 0.6);
        }

        .suggestion-item.priority-medium {
            border: 2px solid #ffd700;
        }

        .suggestion-item.priority-low {
            border: 1px solid #ccc;
            opacity: 0.8;
        }

        .suggestion-rank {
            width: 30px;
            height: 30px;
            background: linear-gradient(135deg, #00d9ff, #0088cc);
            color: #fff;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            font-size: 1.1rem;
            flex-shrink: 0;
        }

        .suggestion-item img {
            width: 50px;
            height: 50px;
            object-fit: contain;
            flex-shrink: 0;
        }

        .suggestion-details {
            flex: 1;
            min-width: 0;
        }

        .suggestion-name {
            font-weight: bold;
            color: #1a1a2e;
            font-size: 0.95rem;
        }

        .suggestion-reason {
            color: #666;
            font-size: 0.8rem;
            margin-top: 2px;
        }

        .suggestion-priority-badge {
            background: linear-gradient(135deg, #00ff88, #00cc70);
            color: #1a1a2e;
            padding: 4px 8px;
            border-radius: 4px;
            font-size: 0.7rem;
            font-weight: bold;
            flex-shrink: 0;
        }

        .priority-medium .suggestion-priority-badge {
            background: linear-gradient(135deg, #ffd700, #ffed4e);
        }

        .priority-low .suggestion-priority-badge {
            background: linear-gradient(135deg, #ccc, #aaa);
        }
    </style>
</head>
<body>
    <div class="overlay-container">
        <div class="overlay-header">
            <h2 id="build-title">🎮 BonkData Overlay</h2>
            <p id="build-subtitle">Build actif en jeu</p>
        </div>

        <!-- Suggestion Panel (hidden by default, shown when level-up detected) -->
        <div id="suggestion-panel" class="suggestion-panel" style="display: none;">
            <!-- Populated by JavaScript when level-up detected -->
        </div>

        <div id="no-build-message" class="no-build" style="display: none;">
            <h3>⚠️ Aucun build actif</h3>
            <p>Activez un build dans l'application principale pour l'afficher ici.</p>
        </div>

        <div id="build-display" style="display: none;">
            <!-- Character -->
            <div class="build-section">
                <h3>👤 Personnage</h3>
                <div id="character-display" class="character-display"></div>
            </div>

            <!-- Weapons -->
            <div class="build-section">
                <h3>⚔️ Armes (4)</h3>
                <div id="weapons-display" class="items-grid"></div>
            </div>

            <!-- Tomes -->
            <div class="build-section">
                <h3>📚 Tomes (4)</h3>
                <div id="tomes-display" class="items-grid"></div>
            </div>
        </div>
    </div>
