<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: file:;">
    <title>BonkData - Overlay</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles/overlay.styles.css">
</head>
<body>
    <!-- Barre de titre personnalisée -->
    <div class="titlebar">
        <div class="titlebar-drag-region">
            <div class="titlebar-icon">🎮</div>
            <div class="titlebar-title">BonkData Overlay</div>
        </div>
        <div class="titlebar-controls">
            <button class="titlebar-button minimize-button" id="minimize-btn" title="Réduire">
                <svg width="12" height="12" viewBox="0 0 12 12">
                    <rect x="0" y="5" width="12" height="2" fill="currentColor"/>
                </svg>
            </button>
            <button class="titlebar-button close-button" id="close-btn" title="Fermer">
                <svg width="12" height="12" viewBox="0 0 12 12">
                    <path d="M1 1L11 11M11 1L1 11" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
                </svg>
            </button>
        </div>
    </div>

    <div class="overlay-container">
        <div class="overlay-header">
            <h2 id="build-title">🎮 BonkData Overlay</h2>
            <p id="build-subtitle">Build actif en jeu</p>
        </div>

        <!-- Suggestion Panel (hidden by default, shown when level-up detected) -->
        <div id="suggestion-panel" class="suggestion-panel" style="display: none;">
            <!-- Populated by JavaScript when level-up detected -->
        </div>

        <div id="no-build-message" class="no-build" style="display: none;">
            <h3>⚠️ Aucun build actif</h3>
            <p>Activez un build dans l'application principale pour l'afficher ici.</p>
        </div>

        <div id="build-display" style="display: none;">
            <!-- Character -->
            <div class="build-section">
                <h3>👤 Personnage</h3>
                <div id="character-display" class="character-display"></div>
            </div>

            <!-- Weapons -->
            <div class="build-section">
                <h3>⚔️ Armes (4)</h3>
                <div id="weapons-display" class="items-grid"></div>
            </div>

            <!-- Tomes -->
            <div class="build-section">
                <h3>📚 Tomes (4)</h3>
                <div id="tomes-display" class="items-grid"></div>
            </div>
        </div>
    </div>

    <script>
        const path = require('path');
        require(path.join(__dirname, 'dist', 'renderer', 'overlay.js'));
    </script>
</body>
</html>
