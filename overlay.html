<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BonkData - Overlay</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
    <style>
        /* Police ALAGARD */
        @font-face {
            font-family: 'Alagard';
            src: url('fonts/alagard.ttf') format('truetype');
            font-weight: normal;
            font-style: normal;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --titlebar-height: 32px;
            --primary: #ff8800;
            --accent: #ffaa33;
            --bg-dark: #2A493D;
            --border-bright: #ff8800;
        }

        /* Scrollbars personnalisées */
        ::-webkit-scrollbar {
            width: 10px;
            height: 10px;
        }

        ::-webkit-scrollbar-track {
            background: rgba(15, 23, 42, 0.5);
            border-radius: 5px;
            margin: 4px;
        }

        ::-webkit-scrollbar-thumb {
            background: linear-gradient(180deg, #ffaa33, #ff8800);
            border-radius: 5px;
            border: 2px solid transparent;
            background-clip: padding-box;
            transition: background 0.2s ease;
        }

        ::-webkit-scrollbar-thumb:hover {
            background: linear-gradient(180deg, #ffcc66, #ffaa33);
            background-clip: padding-box;
        }

        ::-webkit-scrollbar-corner {
            background: transparent;
        }

        /* Barre de titre personnalisée */
        .titlebar {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            height: var(--titlebar-height);
            background: rgba(15, 23, 42, 0.95);
            backdrop-filter: blur(20px);
            border-bottom: 1px solid var(--border-bright);
            display: flex;
            justify-content: space-between;
            align-items: center;
            z-index: 9999;
            user-select: none;
        }

        .titlebar-drag-region {
            flex: 1;
            display: flex;
            align-items: center;
            height: 100%;
            padding: 0 12px;
            -webkit-app-region: drag;
        }

        .titlebar-icon {
            font-size: 14px;
            margin-right: 8px;
        }

        .titlebar-title {
            font-size: 12px;
            font-weight: 600;
            color: var(--accent);
            letter-spacing: 0.5px;
            font-family: 'Alagard', monospace;
        }

        .titlebar-controls {
            display: flex;
            height: 100%;
            -webkit-app-region: no-drag;
        }

        .titlebar-button {
            width: 46px;
            height: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            background: transparent;
            border: none;
            color: #888;
            cursor: pointer;
            transition: all 0.15s ease;
            outline: none;
        }

        .titlebar-button:hover {
            background: rgba(255, 255, 255, 0.1);
        }

        .titlebar-button.close-button:hover {
            background: #ef4444;
            color: white;
        }

        .titlebar-button svg {
            width: 12px;
            height: 12px;
        }

        body {
            font-family: 'Alagard', 'Press Start 2P', 'Courier New', monospace;
            background: #2A493D;
            color: #ffffff;
            padding: 10px;
            padding-top: calc(var(--titlebar-height) + 10px);
            overflow-y: auto;
            font-size: 14px;
            position: relative;
        }

        body::before {
            content: '';
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: transparent;
            pointer-events: none;
            z-index: 0;
        }

        .overlay-container {
            position: relative;
            z-index: 1;
        }

        .overlay-container {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .overlay-header {
            background: #1a1a1a;
            border: 3px solid var(--border-bright);
            border-radius: 0;
            padding: 15px;
            text-align: center;
            box-shadow: none;
            margin-bottom: 10px;
        }

        .overlay-header h2 {
            color: #ffffff;
            font-size: 0.85rem;
            margin-bottom: 8px;
            text-transform: uppercase;
            letter-spacing: 1px;
            text-shadow: 2px 2px 0 #000;
            font-family: 'Alagard', monospace;
        }

        .overlay-header p {
            color: var(--accent);
            font-size: 0.6rem;
            text-shadow: 1px 1px 0 #000;
            letter-spacing: 1px;
            text-transform: uppercase;
            font-family: 'Alagard', monospace;
        }

        .no-build {
            background: #1a1a1a;
            border: 3px solid var(--border-bright);
            border-radius: 0;
            padding: 20px;
            text-align: center;
            box-shadow: none;
        }

        .no-build h3 {
            color: var(--accent);
            margin-bottom: 15px;
            font-size: 0.85rem;
            font-family: 'Alagard', monospace;
            text-shadow: 2px 2px 0 #000;
        }

        .no-build p {
            color: #ffffff;
            font-size: 0.65rem;
            line-height: 1.6;
            font-family: 'Alagard', monospace;
            text-shadow: 1px 1px 0 #000;
        }

        .build-section {
            background: #1a1a1a;
            border-radius: 0;
            padding: 12px;
            border: 2px solid var(--border-bright);
            margin-bottom: 10px;
            box-shadow: none;
        }

        .build-section h3 {
            color: var(--accent);
            font-size: 0.75rem;
            margin-bottom: 12px;
            display: flex;
            align-items: center;
            gap: 5px;
            font-family: 'Alagard', monospace;
            text-transform: uppercase;
            letter-spacing: 1px;
            text-shadow: 2px 2px 0 #000;
            border-bottom: 2px solid var(--border-bright);
            padding-bottom: 8px;
        }

        .items-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 8px;
        }

        .item-card {
            background: linear-gradient(180deg, #888888 0%, #666666 50%, #444444 100%);
            border: none;
            border-radius: 0;
            padding: 8px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 5px;
            transition: all 0.1s ease;
            position: relative;
            box-shadow:
                0 4px 0 #2a2a2a,
                0 6px 0 #1a1a1a,
                0 8px 8px rgba(0, 0, 0, 0.4);
        }

        .item-card:hover {
            background: linear-gradient(180deg, #999999 0%, #777777 50%, #555555 100%);
            transform: translateY(-2px);
            box-shadow:
                0 6px 0 #2a2a2a,
                0 8px 0 #1a1a1a,
                0 10px 12px rgba(0, 0, 0, 0.5);
        }

        .item-card.default {
            background: linear-gradient(180deg, #888888 0%, #666666 50%, #444444 100%);
            box-shadow:
                0 4px 0 #2a2a2a,
                0 6px 0 #1a1a1a,
                0 8px 8px rgba(0, 0, 0, 0.4),
                inset 0 0 0 2px var(--accent);
        }

        .item-card.highlight-detected {
            background: linear-gradient(180deg, #999999 0%, #777777 50%, #555555 100%);
            box-shadow:
                0 4px 0 #2a2a2a,
                0 6px 0 #1a1a1a,
                0 8px 8px rgba(0, 0, 0, 0.4),
                inset 0 0 0 3px #00ff41,
                inset 0 0 20px rgba(0, 255, 65, 0.5);
            animation: borderBlink 0.6s infinite;
            transform: translateY(2px);
            z-index: 10;
        }

        @keyframes borderBlink {
            0%, 100% {
                box-shadow:
                    0 4px 0 #2a2a2a,
                    0 6px 0 #1a1a1a,
                    0 8px 8px rgba(0, 0, 0, 0.4),
                    inset 0 0 0 3px #00ff41,
                    inset 0 0 20px rgba(0, 255, 65, 0.5);
            }
            50% {
                box-shadow:
                    0 4px 0 #2a2a2a,
                    0 6px 0 #1a1a1a,
                    0 8px 8px rgba(0, 0, 0, 0.4),
                    inset 0 0 0 3px #ffff00,
                    inset 0 0 30px rgba(255, 255, 0, 0.6);
            }
        }

        .item-card img {
            width: 50px;
            height: 50px;
            object-fit: contain;
        }

        .item-name {
            font-size: 0.6rem;
            text-align: center;
            color: #ffffff;
            line-height: 1.4;
            font-family: 'Alagard', monospace;
            text-shadow: 1px 1px 0 #000;
            letter-spacing: 0px;
        }

        .item-number {
            position: absolute;
            top: -8px;
            right: -8px;
            background: var(--accent);
            color: #000;
            width: 22px;
            height: 22px;
            border-radius: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 0.75rem;
            font-weight: bold;
            box-shadow:
                0 3px 0 var(--primary-dark),
                0 0 10px rgba(255, 170, 51, 0.8);
            border: 2px solid #000;
            font-family: 'Alagard', monospace;
        }

        .item-number.default {
            background: var(--accent);
            color: #000;
            box-shadow:
                0 3px 0 var(--primary-dark),
                0 0 15px rgba(255, 170, 51, 0.8);
        }

        .character-display {
            display: flex;
            justify-content: center;
            padding: 10px;
        }

        .character-card {
            background: rgba(0, 0, 0, 0.5);
            border: 2px solid rgba(0, 217, 255, 0.5);
            border-radius: 8px;
            padding: 10px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 8px;
        }

        .character-card img {
            width: 80px;
            height: 80px;
            object-fit: contain;
        }

        .character-name {
            font-size: 0.9rem;
            color: #00d9ff;
            font-weight: bold;
        }

        /* Suggestion Panel Styles MEGABONK */
        .suggestion-panel {
            background: linear-gradient(180deg, rgba(255, 0, 110, 0.9) 0%, rgba(180, 41, 249, 0.8) 100%);
            border: 4px solid #00ff41;
            border-radius: 0;
            padding: 15px;
            margin-bottom: 15px;
            box-shadow:
                0 0 30px rgba(255, 0, 110, 0.8),
                0 0 50px rgba(0, 255, 65, 0.6),
                inset 0 0 30px rgba(255, 255, 255, 0.1);
            animation: slideIn 0.3s ease-out, panelPulse 2s ease-in-out infinite;
            position: relative;
            overflow: hidden;
        }

        .suggestion-panel::before {
            content: '';
            position: absolute;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background: repeating-linear-gradient(
                45deg,
                transparent,
                transparent 10px,
                rgba(255, 255, 255, 0.05) 10px,
                rgba(255, 255, 255, 0.05) 20px
            );
            animation: panelScan 3s linear infinite;
            pointer-events: none;
        }

        @keyframes panelScan {
            0% { transform: translate(-25%, -25%) rotate(0deg); }
            100% { transform: translate(-25%, -25%) rotate(360deg); }
        }

        @keyframes panelPulse {
            0%, 100% {
                box-shadow:
                    0 0 30px rgba(255, 0, 110, 0.8),
                    0 0 50px rgba(0, 255, 65, 0.6),
                    inset 0 0 30px rgba(255, 255, 255, 0.1);
            }
            50% {
                box-shadow:
                    0 0 40px rgba(255, 0, 110, 1),
                    0 0 70px rgba(0, 255, 65, 1),
                    inset 0 0 30px rgba(255, 255, 255, 0.1);
            }
        }

        @keyframes slideIn {
            from {
                transform: translateY(-20px);
                opacity: 0;
            }
            to {
                transform: translateY(0);
                opacity: 1;
            }
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
            }
            to {
                opacity: 1;
            }
        }

        .suggestion-header {
            text-align: center;
            margin-bottom: 15px;
            position: relative;
            z-index: 1;
        }

        .suggestion-header h3 {
            color: #ffffff;
            font-size: 0.8rem;
            margin-bottom: 8px;
            font-family: 'Press Start 2P', monospace;
            text-transform: uppercase;
            text-shadow:
                0 0 15px #00ff41,
                0 0 25px #ffff00,
                2px 2px 0 #000;
            animation: headerBlink 1s ease-in-out infinite;
            letter-spacing: 2px;
        }

        @keyframes headerBlink {
            0%, 100% {
                text-shadow:
                    0 0 15px #00ff41,
                    0 0 25px #ffff00,
                    2px 2px 0 #000;
            }
            50% {
                text-shadow:
                    0 0 25px #ffff00,
                    0 0 35px #00ff41,
                    2px 2px 0 #000;
            }
        }

        .suggestion-header p {
            color: #00f5ff;
            font-size: 0.5rem;
            font-family: 'Press Start 2P', monospace;
            text-shadow:
                0 0 5px #00f5ff,
                1px 1px 0 #000;
        }

        .suggestion-list {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .suggestion-item {
            background: linear-gradient(90deg, rgba(0, 0, 0, 0.9) 0%, rgba(0, 0, 0, 0.7) 100%);
            border-radius: 0;
            padding: 10px;
            display: flex;
            align-items: center;
            gap: 10px;
            position: relative;
            animation: fadeIn 0.4s ease-out;
            transition: all 0.2s ease;
            border: 3px solid;
        }

        .suggestion-item:hover {
            transform: translateX(5px);
        }

        .suggestion-item.priority-high {
            border-color: #00ff41;
            box-shadow:
                0 0 20px rgba(0, 255, 65, 0.8),
                inset 0 0 20px rgba(0, 255, 65, 0.2);
        }

        .suggestion-item.priority-medium {
            border-color: #ffff00;
            box-shadow:
                0 0 15px rgba(255, 255, 0, 0.6),
                inset 0 0 15px rgba(255, 255, 0, 0.1);
        }

        .suggestion-item.priority-low {
            border-color: #b429f9;
            opacity: 0.9;
            box-shadow: 0 0 10px rgba(180, 41, 249, 0.4);
        }

        .suggestion-rank {
            width: 32px;
            height: 32px;
            background: #00f5ff;
            color: #000;
            border-radius: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            font-size: 1rem;
            flex-shrink: 0;
            font-family: 'Press Start 2P', monospace;
            border: 3px solid #000;
            box-shadow: 0 0 15px rgba(0, 245, 255, 0.8);
        }

        .suggestion-item img {
            width: 50px;
            height: 50px;
            object-fit: contain;
            flex-shrink: 0;
        }

        .suggestion-details {
            flex: 1;
            min-width: 0;
        }

        .suggestion-name {
            font-weight: normal;
            color: #ffffff;
            font-size: 0.6rem;
            font-family: 'Press Start 2P', monospace;
            text-shadow: 1px 1px 0 #000;
        }

        .suggestion-reason {
            color: #00f5ff;
            font-size: 0.45rem;
            margin-top: 4px;
            font-family: 'Press Start 2P', monospace;
            text-shadow: 1px 1px 0 #000;
        }

        .suggestion-priority-badge {
            background: #00ff41;
            color: #000;
            padding: 5px 10px;
            border-radius: 0;
            font-size: 0.5rem;
            font-weight: bold;
            flex-shrink: 0;
            font-family: 'Press Start 2P', monospace;
            border: 2px solid #000;
            box-shadow: 0 0 10px rgba(0, 255, 65, 0.8);
        }

        .priority-medium .suggestion-priority-badge {
            background: #ffff00;
            box-shadow: 0 0 10px rgba(255, 255, 0, 0.8);
        }

        .priority-low .suggestion-priority-badge {
            background: #b429f9;
            color: #fff;
            box-shadow: 0 0 10px rgba(180, 41, 249, 0.8);
        }
    </style>
</head>
<body>
    <!-- Barre de titre personnalisée -->
    <div class="titlebar">
        <div class="titlebar-drag-region">
            <div class="titlebar-icon">🎮</div>
            <div class="titlebar-title">BonkData Overlay</div>
        </div>
        <div class="titlebar-controls">
            <button class="titlebar-button minimize-button" id="minimize-btn" title="Réduire">
                <svg width="12" height="12" viewBox="0 0 12 12">
                    <rect x="0" y="5" width="12" height="2" fill="currentColor"/>
                </svg>
            </button>
            <button class="titlebar-button close-button" id="close-btn" title="Fermer">
                <svg width="12" height="12" viewBox="0 0 12 12">
                    <path d="M1 1L11 11M11 1L1 11" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
                </svg>
            </button>
        </div>
    </div>

    <div class="overlay-container">
        <div class="overlay-header">
            <h2 id="build-title">🎮 BonkData Overlay</h2>
            <p id="build-subtitle">Build actif en jeu</p>
        </div>

        <!-- Suggestion Panel (hidden by default, shown when level-up detected) -->
        <div id="suggestion-panel" class="suggestion-panel" style="display: none;">
            <!-- Populated by JavaScript when level-up detected -->
        </div>

        <div id="no-build-message" class="no-build" style="display: none;">
            <h3>⚠️ Aucun build actif</h3>
            <p>Activez un build dans l'application principale pour l'afficher ici.</p>
        </div>

        <div id="build-display" style="display: none;">
            <!-- Character -->
            <div class="build-section">
                <h3>👤 Personnage</h3>
                <div id="character-display" class="character-display"></div>
            </div>

            <!-- Weapons -->
            <div class="build-section">
                <h3>⚔️ Armes (4)</h3>
                <div id="weapons-display" class="items-grid"></div>
            </div>

            <!-- Tomes -->
            <div class="build-section">
                <h3>📚 Tomes (4)</h3>
                <div id="tomes-display" class="items-grid"></div>
            </div>
        </div>
    </div>

    <script>
        // Charger le code TypeScript compilé avec require() car nodeIntegration est activé
        require('./dist/renderer/overlay.js');</script>
